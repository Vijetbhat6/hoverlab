<!doctype html>
<!--
  The control for defects.html: the same skeleton with every planted defect
  fixed. `hoverlab audit-url --dir rtl` must report nothing at all here, and
  the end-to-end test fails if it does. That is what makes a green run on the
  defects fixture mean something: a checker that reports on everything would
  find its planted defects too.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clean fixture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 16px/24px Arial, Helvetica, sans-serif; color: #222; background: #fff; }
  main { position: static; width: 960px; margin: 0 auto; padding: 16px 0; }
  h1 { font-size: 32px; line-height: 40px; margin-bottom: 16px; }
  .muted { color: #595959; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card { background: #f4f4f5; border-radius: 8px; padding: 16px; margin-bottom: 8px; }
  .toolbar { position: relative; display: flex; gap: 8px; width: 600px; height: 48px; padding-inline: 48px; margin: 16px 0; background: #eee; }
  .chip { width: 100px; height: 32px; margin-top: 8px; padding: 4px 8px; background: #ddd; border-radius: 8px; }
  .close { position: absolute; inset-inline-start: 12px; top: 12px; width: 24px; height: 24px; border: 0; background: #ccc; }
  .pin { width: 120px; margin-bottom: 16px; }
  .more { display: inline-block; margin-bottom: 16px; }
  .flip { }
  [dir="rtl"] .flip { transform: scaleX(-1); }
</style>
</head>
<body>
<main>
  <h1>Clean fixture</h1>
  <p class="muted">Muted paragraph in a grey that reads comfortably.</p>
  <div class="pin"><span>Label that wraps inside its box</span></div>
  <div class="toolbar">
    <button class="close" type="button">x</button>
    <div class="chip">One</div>
    <div class="chip">Two</div>
    <div class="chip">Three</div>
  </div>
  <a class="more" href="#">Read more <svg class="lucide lucide-arrow-right flip" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
  <a class="more" href="#">Next <svg class="lucide lucide-chevron-right flip" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></a>
  <div class="grid" id="grid"></div>
</main>
<script>
  var grid = document.getElementById('grid');
  for (var i = 1; i <= 30; i++) {
    var card = document.createElement('article');
    card.className = 'card';
    card.textContent = 'Card ' + i + ' content';
    grid.appendChild(card);
  }
</script>
</body>
</html>
