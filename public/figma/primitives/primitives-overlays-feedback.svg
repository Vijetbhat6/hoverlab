<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="1542" viewBox="0 0 1216 1542" id="Hoverlab — Overlays &amp; Feedback">
  <!--
    Hoverlab — Overlays & Feedback. 4 controls, traced from the
    rendered catalog. Drag this file onto a Figma canvas.

    These are frames, not components: named, editable layers with real
    geometry, colour and type. There are no variants, no auto-layout,
    and no hover or motion — none of those exist in a static frame.

    Every one of these is free to copy as code at https://hoverlab.dev/primitives
  -->
  <rect id="Background" x="0" y="0" width="1216" height="1542" fill="#ffffff" />
  <text id="Alert label" x="64" y="84" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#0a0a0a">Alert</text>
