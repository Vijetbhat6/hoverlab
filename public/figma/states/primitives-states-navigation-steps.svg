        <path d="M20 6 9 17l-5-5" />
      </g>
      <rect id="container 5" x="498.66" y="40" width="98.67" height="2" rx="1" fill="#00782e" />
      <rect id="container 6" x="597.33" y="25" width="32" height="32" rx="16" fill="#fdfcf8" stroke="#00782e" stroke-width="2" />
      <rect id="container 7" x="637.33" y="40" width="98.67" height="2" rx="1" fill="#dbdee1" />
      <rect id="container 8" x="736" y="25" width="32" height="32" rx="16" fill="#fdfcf8" stroke="#dbdee1" stroke-width="2" />
  </g>
  <text id="State=Long text label progress-steps" x="4672" y="138" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#0a0a0a">State=Long text</text>
  <g id="State=Long text" transform="translate(4672, 148)">
    <rect id="container" x="0" y="0" width="1088" height="130" rx="16" fill="#fdfcf8" stroke="rgba(220, 222, 225, 0.6)" stroke-width="1" />
      <rect id="container 2" x="320" y="25" width="32" height="32" rx="16" fill="#00782e" stroke="#00782e" stroke-width="2" />
      <g id="icon check" transform="translate(328 33) scale(0.667 0.667)" fill="none" stroke="#fcfcfc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5" />
      </g>
      <rect id="container 3" x="360" y="40" width="218.83" height="2" rx="1" fill="#00782e" />
      <text id="Cart" x="320" y="80" fill="#080c0f" font-family="Geist, &quot;Geist Fallback&quot;" font-size="14" font-weight="500">Cart</text>
      <text id="Wolfeschlegelsteinhausenbergerdorff" x="320" y="100" fill="#080c0f" font-family="Geist, &quot;Geist Fallback&quot;" font-size="14" font-weight="500">Wolfeschlegelsteinhausenbergerdorff</text>
      <rect id="container 4" x="578.83" y="25" width="32" height="32" rx="16" fill="#00782e" stroke="#00782e" stroke-width="2" />
      <g id="icon check 2" transform="translate(586.828 33) scale(0.667 0.667)" fill="none" stroke="#fcfcfc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5" />
