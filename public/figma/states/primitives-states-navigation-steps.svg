  <text id="State=Loading label progress-steps" x="2752" y="138" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#0a0a0a">State=Loading</text>
  <text id="State=Loading note progress-steps" x="2752" y="164" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#737373">n/a: no interactive element</text>
  <text id="State=Error label progress-steps" x="3136" y="138" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#0a0a0a">State=Error</text>
  <text id="State=Error note progress-steps" x="3136" y="164" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#737373">n/a: no form control</text>
  <text id="State=Empty label progress-steps" x="3520" y="138" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#0a0a0a">State=Empty</text>
  <g id="State=Empty" transform="translate(3520, 148)">
    <rect id="container" x="0" y="0" width="1088" height="90" rx="16" fill="#fdfcf8" stroke="rgba(220, 222, 225, 0.6)" stroke-width="1" />
      <rect id="container 2" x="320" y="25" width="32" height="32" rx="16" fill="#00782e" stroke="#00782e" stroke-width="2" />
      <g id="icon check" transform="translate(328 33) scale(0.667 0.667)" fill="none" stroke="#fcfcfc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5" />
      </g>
      <rect id="container 3" x="360" y="40" width="98.66" height="2" rx="1" fill="#00782e" />
      <rect id="container 4" x="458.66" y="25" width="32" height="32" rx="16" fill="#00782e" stroke="#00782e" stroke-width="2" />
