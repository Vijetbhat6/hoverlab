<?xml version="1.0" encoding="utf-8"?>
<!-- Hoverlab favicon — gradient tile + wand spark.
     Matches the brand badges used in the in-app header (gradient + Wand2 icon). -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Rounded background tile -->
  <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#g)"/>
  <!-- Wand: diagonal rod with spark tip + small star -->
  <g fill="#ffffff">
    <!-- Rod (rotated 45°) -->
    <rect x="7.5" y="20.5" width="13" height="2.6" rx="1.3"
          transform="rotate(-45 14 21.8)"/>
    <!-- Spark tip (4-point star at top-right) -->
    <path d="M23 6 L24 10 L28 11 L24 12 L23 16 L22 12 L18 11 L22 10 Z"/>
    <!-- Small companion spark -->
    <path d="M18 17 L18.6 19 L20.6 19.6 L18.6 20.2 L18 22.2 L17.4 20.2 L15.4 19.6 L17.4 19 Z" opacity="0.9"/>
  </g>
</svg>
