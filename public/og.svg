<?xml version="1.0" encoding="utf-8"?>
<!-- Hoverlab OG/social card — 1200×630, gradient bg, big wordmark + tagline. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0b1f17"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="380" fill="url(#glow)"/>

  <!-- Favicon tile (left of wordmark) -->
  <g transform="translate(120 215)">
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#tile)"/>
    <g fill="#ffffff" transform="translate(100 100)">
      <rect x="-65" y="-7" width="130" height="14" rx="7" transform="rotate(-45)"/>
      <path d="M65 -70 L72 -45 L97 -38 L72 -31 L65 -6 L58 -31 L33 -38 L58 -45 Z"/>
      <path d="M35 5 L38 18 L51 21 L38 24 L35 37 L32 24 L19 21 L32 18 Z" opacity="0.92"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="360" y="335" font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
        font-size="128" font-weight="700" fill="#ffffff" letter-spacing="-3">Hoverlab</text>

  <!-- Tagline -->
  <text x="365" y="405" font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
        font-size="32" font-weight="400" fill="#9ca3af" letter-spacing="0.5">A living CSS effects library</text>

  <!-- Bottom-right metadata strip -->
  <text x="1080" y="585" text-anchor="end"
        font-family="'JetBrains Mono','Menlo',monospace"
        font-size="20" font-weight="400" fill="#4b5563">1,680 effects · 13 categories · pure CSS</text>
</svg>
