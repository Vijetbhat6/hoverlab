# Publishes the Hoverlab VS Code extension (packages/vscode) to the Visual
# Studio Marketplace and to Open VSX. Open VSX is the one Cursor, Windsurf
# and VSCodium install from; they do not read Microsoft's marketplace.
#
# HOW TO RELEASE
#
#   1. Bump "version" in packages/vscode/package.json, add a CHANGELOG entry,
#      commit and push it.
#   2. git tag vscode-v<that version> && git push origin vscode-v<that version>
#
# The tag must equal "vscode-v" + the package.json version or the run fails
# before anything is published.
#
# SECRETS (repo Settings > Secrets and variables > Actions). Both are
# optional: a marketplace whose secret is missing is skipped with a notice,
# not failed, so the workflow is safe to merge before either account exists.
#
#   VSCE_PAT  Visual Studio Marketplace. An Azure DevOps personal access
#             token, organisation "All accessible organizations", scope
#             Marketplace > Manage. Create it at dev.azure.com (User settings
#             > Personal access tokens); the "hoverlab" publisher has to
#             exist first at https://marketplace.visualstudio.com/manage.
#
#   OVSX_PAT  Open VSX. An access token from https://open-vsx.org/user-settings/tokens
#             (sign in with GitHub, agree to the Publisher Agreement). The
#             "hoverlab" namespace has to exist first:
#             npx ovsx create-namespace hoverlab -p <token>
#
# DRY RUN
#
# Actions > "Publish VS Code extension" > Run workflow builds and inspects
# the .vsix and uploads it as a workflow artifact, and does nothing else.
# "dry-run" defaults to true. Setting it to false publishes for real, but
# only when the workflow is run against a vscode-v* tag, never a branch.
#
# Nothing in here can publish from a branch push or a pull request.

name: Publish VS Code extension

on:
  push:
    tags:
      - 'vscode-v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and inspect the .vsix only; publish nothing'
        type: boolean
        default: true

# Nothing is granted by default. Each job asks for exactly what it uses.
permissions: {}

concurrency:
  group: publish-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the .vsix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      vsix: ${{ steps.meta.outputs.vsix }}
      publish: ${{ steps.meta.outputs.publish }}
    defaults:
      run:
        working-directory: packages/vscode
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: @vscode/vsce 4 and ovsx 1.2 both declare node >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/vscode/package-lock.json

      - name: Install (extension, hoverlab from npm, vsce and ovsx)
        run: npm ci

      - name: Work out what this run is allowed to do, and check the tag
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry-run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=hoverlab-vscode-$version.vsix" >> "$GITHUB_OUTPUT"

          # A push here is always a vscode-v* tag. A manual run publishes only
          # when dry-run was turned off, and only from a tag.
          if [ "$EVENT" = "push" ] || [ "$DRY_RUN" = "false" ]; then
            publish=true
          else
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

          if [ "$REF_TYPE" = "tag" ]; then
            expected="vscode-v$version"
            if [ "$REF_NAME" != "$expected" ]; then
              echo "::error title=Tag does not match package.json::The tag is '$REF_NAME' but packages/vscode/package.json says version $version, so the tag should be '$expected'. Nothing was published. Fix whichever is wrong and re-tag."
              exit 1
            fi
            echo "Tag $REF_NAME matches package.json version $version."
          elif [ "$publish" = "true" ]; then
            echo "::error title=Refusing to publish from a branch::A real publish must run against a vscode-v$version tag, and this run is on branch '$REF_NAME'. Re-run with the tag selected, or leave dry-run on."
            exit 1
          else
            echo "::notice title=Dry run::Building $version from branch '$REF_NAME'. Tag check skipped, nothing will be published."
          fi

      - name: Package
        run: npx --no-install vsce package --out "${{ steps.meta.outputs.vsix }}"

      # A green build that shipped an extension with nothing to load is the
      # failure this guards against: the CLI has to be inside as real files,
      # and nothing that looks like a secret or a leftover may be.
      - name: Inspect the .vsix
        env:
          VSIX: ${{ steps.meta.outputs.vsix }}
        run: |
          set -euo pipefail
          ls -l "$VSIX"
          unzip -l "$VSIX"
          unzip -Z1 "$VSIX" > vsix-files.txt
          grep -qx 'extension/node_modules/hoverlab/src/index.mjs' vsix-files.txt \
            || { echo "::error::The hoverlab package is not inside the .vsix; every command would fail on first use."; exit 1; }
          grep -qx 'extension/src/extension.js' vsix-files.txt \
            || { echo "::error::extension/src/extension.js is missing from the .vsix."; exit 1; }
          if grep -Ei '(^|/)(\.env[^/]*|[^/]*\.tgz|[^/]*\.vsix|[^/]*\.pem|[^/]*\.key|package-lock\.json)$|(^|/)(test|tests)/|\.test\.m?js$' vsix-files.txt; then
            echo "::error::The .vsix contains files that should not ship (listed above). Tighten packages/vscode/.vscodeignore."
            exit 1
          fi
          rm vsix-files.txt
          {
            echo "### Built \`$VSIX\`"
            echo
            echo "$(unzip -Z1 "$VSIX" | wc -l) entries, $(du -k "$VSIX" | cut -f1) KB. Publishing this run: \`${{ steps.meta.outputs.publish }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: packages/vscode/${{ steps.meta.outputs.vsix }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach the .vsix to a GitHub release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vscode-vsix

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$VSIX" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Hoverlab for VS Code ${TAG#vscode-v}" \
              --generate-notes
          fi

  publish:
    name: Publish to the marketplaces
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/vscode/package-lock.json

      - name: Install (for vsce and ovsx only)
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: vscode-vsix
          path: packages/vscode

      # Both steps publish the exact file that was built and inspected above,
      # not a fresh package. --skip-duplicate makes a re-run after a partial
      # failure (one marketplace up, the other not) safe.
      - name: Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice title=Visual Studio Marketplace skipped::The VSCE_PAT secret is not set, so nothing was published there. See the header of .github/workflows/publish-vscode.yml."
            echo "- Visual Studio Marketplace: skipped (VSCE_PAT not set)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --no-install vsce publish --packagePath "$VSIX" --skip-duplicate
          echo "- Visual Studio Marketplace: published $VSIX" >> "$GITHUB_STEP_SUMMARY"

      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::notice title=Open VSX skipped::The OVSX_PAT secret is not set, so nothing was published there. See the header of .github/workflows/publish-vscode.yml."
            echo "- Open VSX: skipped (OVSX_PAT not set)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --no-install ovsx publish "$VSIX" --skip-duplicate
          echo "- Open VSX: published $VSIX" >> "$GITHUB_STEP_SUMMARY"
